---

##########
# COMMON #
##########

deploy_user: changeit # System user ( e.g. my_user if `pwd` shows /home/my_user) # REQUIRED
deploy_env: changeit # Container name suffix (e.g. prod, qa). Leave as changeit if not needed.
docker_users:
  - changeit # same as deploy_user #REQUIRED
docker_restart: yes

###########
# monitor #
###########

monitor_path: monitor

# Anounymous Login
GRAFANA_AUTH_ANONYMOUS_ENABLED: true # set it to true if you want to access your dashboard without authentication
GRAFANA_AUTH_ANONYMOUS_ORG_ROLE: Admin

# Basic Auth
GRAFANA_AUTH_BASIC_ENABLED: false # set it to true to enable username/password login
GRAFANA_ADMIN_USER: admin # default admin username for basic auth
GRAFANA_ADMIN_PASSWORD: your_admin_password # default admin password for basic auth - change this!

# GitHub Oauth
GRAFANA_GITHUB_AUTH_ENABLED: false # Disable Caddy's OIDC in below sections if you prefer to use Grafana's built-in OIDC
GRAFANA_GITHUB_CLIENT_ID: your_client_id # REQUIRED if GRAFANA_AUTH_ANONYMOUS_ENABLED is false
GRAFANA_GITHUB_CLIENT_SECRET: your_client_secret # REQUIRED if GRAFANA_AUTH_ANONYMOUS_ENABLED is false
GRAFANA_GITHUB_ALLOWED_ORG: ["org1"] # e.g. ["org1", "org2"]
GRAFANA_GITHUB_ROLE: "'Admin'" # refer here for additional infos => https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/github/

# Alerts
GRAFANA_SERVER_ROOT_URL: https://monitor.example.com # your dashboard url # REQUIRED
GRAFANA_ALERT_HOST: monitor.example.com # REQUIRED

# SMTP for alerts
GRAFANA_SMTP_PASSWORD: your_password
GRAFANA_SMTP_HOST: mail.example.com
GRAFANA_SMTP_USER: user@example.com
GRAFANA_SMTP_SENDER: user@example.com

############
# SUPABASE #
############

supabase_path: supabase/docker
kong_conf_path: volumes/api

# Supabase dashboard log drain (Logflare + Vector). Rendered by setup.sh from
# required.enable_logging. When true, start-supabase.sh also boots
# docker-compose-logs.yml; set to false to disable log drain in the dashboard.
log_drain_enabled: true

# Supabase services — toggled by setup.sh from required.services. Each gates
# the corresponding service in docker-compose-supabase.yml.j2. db (Postgres)
# and kong (API gateway) are always required and have no toggle here.
auth_enabled: true
rest_enabled: true
realtime_enabled: true
storage_enabled: true
imgproxy_enabled: true
functions_enabled: true
studio_enabled: true
meta_enabled: true
supavisor_enabled: true

# MCP (Model Context Protocol) secure access.
# The /mcp Kong route is restricted to these IPs only. Docker source-NATs
# host-originated connections to the bridge gateway IP (172.28.0.1 - see the
# pinned subnet in docker-compose-supabase.yml.j2), so this default must match
# that gateway; 127.0.0.1 is never seen by Kong for host traffic. Keep the MCP
# server out of the public Internet; authorized remote clients connect via SSH
# tunnel (see docs/advanced-docs.md -> "Secure MCP Remote Access").
# To allow a private VPN subnet in addition, e.g.:
#   mcp_allowed_ips:
#     - 172.28.0.1
#     - 10.0.0.0/24
# Set to [] to fully disable /mcp.
mcp_allowed_ips:
  - 172.28.0.1

postgres_db_pwd: changeit # REQUIRED

#### Refer to https://supabase.com/docs/guides/self-hosting/docker to generate jwt, anon and service role keys
sb_jwt_secret: changeit # REQUIRED
sb_anon_key: changeit # REQUIRED
sb_service_role_key: changeit #REQUIRED
secret_key_base: changeit # generate with: openssl rand -base64 48
vault_enc_key: changeit # generate with: openssl rand -hex 16
pg_meta_crypto_key: changeit # generate with: openssl rand -base64 24
logflare_public_access_token: changeit # generate with: openssl rand -base64 24
logflare_private_access_token: changeit # generate with: openssl rand -base64 24
s3_protocol_access_key_id: changeit # generate with: openssl rand -hex 16
s3_protocol_access_key_secret: changeit # generate with openssl: rand -hex 32
pooler_tenant_id: changeit

#### Asymmetric key pair (ES256) and opaque api keys
# Opaque API key for client-side use (anon role).
sb_publishable_key:
# Opaque API key for server-side use (service_role). Never expose in client code.
sb_secret_key:
# JSON array of signing JWKs (EC private + legacy symmetric).
# Used by Auth.
sb_jwt_keys:
# JWKS for token verification (EC public + legacy symmetric).
# Used by PostgREST, Realtime, Storage to verify tokens.
sb_jwt_jwks:


site_url: https://app.example.com # Website url
api_external_url: https://supa.example.com/auth/v1 # For supabase studio # REQUIRED (must include /auth/v1 — set by setup.sh from required.api_external_url)
additional_redirect_urls: changeit # https://app.example.com/auth/callback
mailer_templates_base_url: changeit # https://app.example.com

## Email auth
enable_email_signup: true
enable_email_autoconfirm: false
smtp_admin_email: changeit # user@example.com
smtp_host: changeit # mail.example.com
smtp_port: 587
smtp_user: changeit # user@example.com
smtp_password: changeit
smtp_sender_name: changeit

#### Oauth / Social login providers
google_enabled: false
google_client_id: changeit
google_secret: changeit

github_enabled: false
github_client_id: changeit
github_secret: changeit

azure_enabled: false
azure_client_id: changeit
azure_secret: changeit

facebook_enabled: false
facebook_client_id: changeit
facebook_secret: changeit

openai_api_key: changeit


#########
# CADDY #
#########

#### Provider configurations 
SSO_PROVIDER: github # available: Generic, github, gitlab & discord

############### ! UPDATE BELOW VARIABLES BASED ON SSO_PROVIDER YOU CHOSE #################

##Generic #https://github.com/authcrunch/authcrunch.github.io/blob/main/assets/conf/oauth/generic/Caddyfile
oidc_realm: generic
oidc_driver: generic
oidc_client_id: changeit
oidc_client_secret: changeit
base_auth_url: changeit #e.g https://keycloak.domain.com/
metadata_url: changit #e.g https://keycloak.myfiosgateway.com/.well-known/openid-configuration
app_url: changeit # your app or dashboard protected with OIDC e.g https://myapp.domain.com
generic_allow_list: "user1@gmail.com user2@gmail.com" # Allowed users

##Gitlab #https://docs.authcrunch.com/docs/authenticate/oauth/backend-oauth2-0009-gitlab
gitlab_domain: gitlab.example.com
gitlab_oauth_client_id: changeit
gitlab_oauth_client_secret: changeit
gitlab_allow_list: "user1@example.com user2@example.com"
gitlab_group_filters:
  - group1
  - ^a #all groups starting with a

##GitHub #https://docs.authcrunch.com/docs/authenticate/oauth/backend-oauth2-0007-github
github_oauth_client_id: changeit
github_oauth_client_secret: changeit
github_allow_list: "github.com/user1 github.com/user2"

##Discord #https://docs.authcrunch.com/docs/authenticate/oauth/backend-oauth2-0013-discord
discord_oauth_client_id: changeit
discord_oauth_client_secret: changeit
admin_role_id: changeit # your admin user ID
discord_guild_id: changeit # your Discord server ID

##########################################################################################

## Common vars between Gitlab, GitHub & Discord
base_auth_domain: auth.example.com # sub-domain will be used as an authentication endpoint
root_domain: example.com # for storing cookies
jwt_shared_key: changeit # generated by setup.sh / generate-keys.sh (openssl rand -base64 32)
# Issue certificates from Caddy's own CA instead of Let's Encrypt. For hosts
# with no public DNS — CI, a lab box. Set from advanced.caddy.tls_internal.
caddy_tls_internal: false

#### Caddyfile configuration
projects:
  supabase:
    log_file: supabase-access
    domain: "sb.example.com"
#    allowed_ips:
#      - 123.123.123.123
#      - 111.111.111.111
    oidc_enabled: true
    upstreams:
      # Dashboard with optional auth
      - targets: ["localhost:3001"]
        paths: [""]
        oidc: true
#        basicauth:
#          - path: /project/default
#            username: you_user
            # Generate with caddy hash-password
#            password: $2at3jQ0mIR7Mg0kLwP/BgCKRzz3MRnq0wapfFjypEhosvu
      # API routes
      - targets: ["localhost:8000"]
        paths:
          - /rest/v1/*
          - /auth/v1/*
          - /realtime/v1/*
          - /storage/v1/*
          - /functions/v1/*
        oidc: false

  monitor:
    log_file: monitor-access
    domain: "monitor.example.com"
    oidc_enabled: true
    upstreams:
      - targets: ["localhost:3002"]
        paths: [""]
        oidc: true


############
# FAIL2BAN #
############

fail2ban_packages:
  - fail2ban
fail2ban_service: fail2ban

#############
# pgBackRest Backup #
#############

# Master toggle (set by setup.sh from components.backup)
backup_enabled: false

# Repository type: minio (local, default) | s3 (external) | posix (local fs)
backup_repo_type: minio

# S3 repo config (when backup_repo_type: s3)
backup_s3_endpoint: changeit
backup_s3_region: us-east-1
backup_s3_bucket: changeit
backup_s3_key: changeit
backup_s3_key_secret: changeit
backup_s3_uri_style: path
backup_s3_verify_tls: true

# MinIO creds (when backup_repo_type: minio)
minio_root_user: minioadmin
minio_root_password: minioadmin

# Encryption (forced ON for s3 repo by setup.sh)
backup_encryption: false
backup_cipher_type: aes-256-cbc
backup_cipher_pass: changeit

# Credentials source: env (plaintext, warned) | vault (Ansible Vault)
backup_creds_source: env

# Retention (hobby-safe defaults)
backup_retention_full: 3
backup_retention_diff: 3
backup_retention_archive: 3
backup_retention_archive_type: full

# WAL archiving (always on — guardrail)
backup_wal_archiving: true

# Initial full backup on enable
backup_initial_on_enable: true

# Schedules (cron expressions)
backup_cron_full: "0 3 * * 1"
backup_cron_diff: "0 3 * * 2-7"
backup_cron_verify: "0 4 * * *"
backup_cron_drill: "0 5 * * 6"

# Restore drill (opt-in)
backup_restore_drill: false

# Daily repo integrity check (always on)
backup_repo_check: true

# Storage + pgsodium backup
backup_storage_enabled: true
backup_pgsodium_enabled: true

# Monitoring
backup_monitoring_enabled: true


############
# Firewall #
############

# SSH is allowed always
firewall_allow:
  - port: 80
  - port: 443
  - port: 5432
    ip: 111.111.111.111
  - port: 5432
    ip: 123.123.123.123
    cidr: 32

firewall_deny:
  - port: 3000
  - port: 3001
  - port: 8000
  - port: 9100
#  - port: 5000
#    ip: 111.111.111.111
#  - port: 443
#    ip: 123.123.123.123
#    cidr: 32


##################################
# At Rest Disk Encryption (LUKS) #
##################################

supabase_encryption:
  enabled: false

luks_device: changeit # volume to be encrypted e.g. /dev/disk/by-id/YOU_VOLUME_NAME
luks_name: encrypted_data
luks_mount_point: /data
luks_filesystem: ext4
luks_key_file: /root/.luks_keyfile
mount_options: "defaults,noatime,nofail"

# A subdirectory of the encrypted volume, never its root. mkfs.ext4 puts
# lost+found at the root of a fresh filesystem, so PGDATA would not be empty and
# initdb refuses to touch a directory that is not — the container then never
# becomes healthy and the whole stack times out waiting on it:
#   dependency failed to start: container supabase-db is unhealthy
# Nothing has ever deployed with encryption on (the role could not format a
# volume until now), so there is no existing layout to migrate.
supabase_data_path: "{{ luks_mount_point ~ '/pgdata' if supabase_encryption.enabled else '/var/lib/supabase/data' }}"

#############
# HARDENING #
#############
# Rendered by setup.sh from components.hardening + advanced.hardening. Debian
# and Ubuntu use identical settings, so no per-distro config is needed. Defaults
# reflect the shipped config; setup.sh overrides them when the component is
# enabled.

# Master toggles (each subset is independent).
harden_ssh_enabled: false
harden_sysctl_enabled: false
harden_fs_enabled: false

# SSH drop-in values ("yes"/"no"). permit_root_login=false maps to "no" (deny
# root); password_auth=true maps to "no" (force key-only; OPT-IN); forwarding
# options true=>"yes".
harden_ssh_permit_root_login: "no"
harden_ssh_password_auth: "yes"
harden_ssh_pubkey_auth: "yes"
harden_ssh_permit_empty_passwords: "no"
harden_ssh_max_auth_tries: "3"
harden_ssh_login_grace_time: "30"
harden_ssh_allow_tcp_forwarding: "yes"
harden_ssh_x11_forwarding: "yes"
harden_ssh_allow_agent_forwarding: "yes"
harden_ssh_client_alive_interval: "300"
harden_ssh_client_alive_count_max: "2"
harden_ssh_use_dns: "no"

# Docker-safe sysctl keys (ip_forward / IPv6 forwarding intentionally absent).
harden_sysctl_keys:
  net.ipv4.tcp_syncookies: "1"
  net.ipv4.conf.all.rp_filter: "1"
  net.ipv4.conf.default.rp_filter: "1"
  net.ipv4.conf.all.log_martians: "1"
  net.ipv4.conf.default.log_martians: "1"
  net.ipv4.conf.all.accept_source_route: "0"
  net.ipv4.conf.default.accept_source_route: "0"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.default.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
  net.ipv4.conf.default.send_redirects: "0"
  net.ipv4.icmp_echo_ignore_broadcasts: "1"
  net.ipv4.icmp_ignore_bogus_error_responses: "1"
  net.ipv4.tcp_rfc1337: "1"
  kernel.randomize_va_space: "2"
  kernel.core_uses_pid: "1"
  fs.suid_dumpable: "0"

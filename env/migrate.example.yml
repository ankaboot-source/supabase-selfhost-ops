# =============================================================================
# migrate.example.yml — Migration configuration
# =============================================================================
# Copy this file to env/migrate.yml and edit it:
#   cp env/migrate.example.yml env/migrate.yml
#   # edit env/migrate.yml, then run:
#   ./migrate.sh --config env/migrate.yml --yes
#
# IMPORTANT: target.db_url MUST use supabase_admin (superuser that owns
# auth/storage schemas). The default postgres user lacks the privileges to
# restore auth/storage DDL.
#
# INVARIANT: the script is READ-ONLY against the source project. It never
# writes to the source.
#
# Sections:
#   SOURCE   — The Supabase Cloud project you are migrating FROM.
#   TARGET   — The self-hosted instance you are migrating INTO.
#   TOOLS    — Paths to required binaries (defaults resolve via PATH).
# ============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# SOURCE — Supabase Cloud project (read-only)
# ─────────────────────────────────────────────────────────────────────────────
source:
  # Project ref — found in the Dashboard URL or Settings → API.
  project_ref: changeit            # e.g. abcdefghijklmnop

  # Direct Postgres connection string to the Cloud project.
  # Use the pooler DSN (port 6543 for transaction mode, 5432 for session mode).
  db_url: changeit                 # postgresql://postgres.[ref]:[pwd]@db.[ref].supabase.co:6543/postgres

  # S3-compatible storage endpoint credentials (Supabase Cloud S3 API).
  storage_endpoint: changeit       # https://[ref].storage.supabase.co/storage/v1/s3
  storage_access_key: changeit
  storage_secret_key: changeit
  storage_region: changeit         # e.g. us-east-1

  # Optional: Supabase CLI access token (needed to list/download edge functions
  # and list edge-function secret names). Generate one in the Dashboard under
  # Account → Access Tokens. You may also export SUPABASE_ACCESS_TOKEN instead.
  # If unset, the Supabase CLI must already be logged in (supabase login).
  access_token: changeit


# ─────────────────────────────────────────────────────────────────────────────
# FUNCTIONS — Edge function migration (opt-in, defaults to enabled)
# ─────────────────────────────────────────────────────────────────────────────
# Edge function CODE is downloaded from the Cloud project via the Supabase CLI
# and deployed into the self-hosted instance's functions mount (filesystem-based
# deploy — `supabase functions deploy` targets Cloud, not a self-hosted host).
#
# Edge function secret VALUES cannot be retrieved from Cloud (they are
# write-only). Only their NAMES can be listed. The script writes each name as an
# empty `NAME=` entry into the self-hosted <supabase_path>/.env.functions file,
# and the manual-steps report tells you to fill in the values and recreate the
# functions container. With this repo's default supabase_path, the file lives at
# ~/supabase/docker/.env.functions.
functions:
  enabled: true                    # set false to skip edge-function migration
  # Self-hosted functions mount. Default matches this repo's supabase_path;
  # override only if you deployed to a custom supabase_path/domain.
  target_dir: supabase/docker/volumes/functions


# ─────────────────────────────────────────────────────────────────────────────
# TARGET — Self-hosted Supabase instance
# ─────────────────────────────────────────────────────────────────────────────
target:
  # IMPORTANT: Connect as supabase_admin (superuser), NOT postgres.
  # The supabase_admin password is in your Supabase .env file under
  # SUPABASE_ADMIN_PASSWORD (or SUPABASE_AUTH_EXTERNAL_SUPABASE_ADMIN_PASSWORD).
  #
  # For a local Docker instance:
  #   db_url: postgresql://supabase_admin:<password>@localhost:5432/postgres
  db_url: changeit

  # Self-hosted storage endpoint (Kong /storage/v1 on the API port).
  storage_endpoint: http://localhost:8000/storage/v1/s3
  # These come from env/supabase.yml:
  #   s3_protocol_access_key_id / s3_protocol_access_key_secret
  storage_access_key: changeit
  storage_secret_key: changeit
  storage_region: local


# ─────────────────────────────────────────────────────────────────────────────
# TOOLS — Required binaries (defaults resolve via PATH)
# ─────────────────────────────────────────────────────────────────────────────
tools:
  pg_dump: pg_dump
  pg_restore: pg_restore
  rclone: rclone
  psql: psql
  supabase: supabase

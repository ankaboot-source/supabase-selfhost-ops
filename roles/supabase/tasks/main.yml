---
- name: Check if Supabase folder exists
  ansible.builtin.stat:
    path: "/home/{{ deploy_user }}/supabase"
  register: supabase_dir

- name: Clone Supabase
  ansible.builtin.git:
    repo: https://github.com/supabase/supabase
    dest: "/home/{{ deploy_user }}/supabase"
    depth: 1
  when: not supabase_dir.stat.exists

- name: Ensure correct ownership
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/supabase"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    recurse: yes

- name: Ensure /var/log/postgresql directory exists
  ansible.builtin.file:
    path: /var/log/postgresql
    state: directory
    owner: "100"
    group: "101"
    mode: "0755"

- name: Ensure Supabase data directory exists
  ansible.builtin.file:
    path: "{{ supabase_data_path }}"
    state: directory
    owner: "100"
    group: "101"
    mode: '0755'

- name: Ensure Supabase public domain is configured
  ansible.builtin.assert:
    that:
      - "(((projects | default({})).supabase | default({})).domain | default('')) not in ['', 'changeit', 'your-domain.com', 'sb.example.com']"
    fail_msg: >-
      projects.supabase.domain is not set to a real public domain. It is used to
      locate the Caddy TLS certificate and to generate the Postgres SSL
      certificate. Run setup.sh so it is rendered from required.supabase_domain.
    quiet: yes

- name: Check if Caddy certificate exists
  ansible.builtin.stat:
    path: "{{ caddy_cert_base_path }}/{{ projects.supabase.domain }}/{{ projects.supabase.domain }}.crt"
  register: caddy_cert

- name: Ensure Certs directory exists
  ansible.builtin.file:
    path: "{{ postgres_cert_path }}"
    state: directory
    owner: "100"
    group: "101"
    mode: "0755"

- name: Copy Postgres SSL certificate
  ansible.builtin.copy:
    src: "{{ caddy_cert_base_path }}/{{ projects.supabase.domain }}/{{ projects.supabase.domain }}.crt"
    dest: "{{ postgres_cert_path }}/server.crt"
    remote_src: yes
    owner: "100"
    group: "101"
    mode: "0644"
  when: caddy_cert.stat.exists

- name: Copy Postgres SSL key
  ansible.builtin.copy:
    src: "{{ caddy_cert_base_path }}/{{ projects.supabase.domain }}/{{ projects.supabase.domain }}.key"
    dest: "{{ postgres_cert_path }}/server.key"
    remote_src: yes
    owner: "100"
    group: "101"
    mode: "0600"
  when: caddy_cert.stat.exists

- name: Validate Postgres cert exists
  ansible.builtin.stat:
    path: "{{ postgres_cert_path }}/server.crt"
  register: pg_cert

- name: Check Postgres cert matches the configured domain
  ansible.builtin.shell: |
    openssl x509 -in {{ postgres_cert_path }}/server.crt -noout -subject -nameopt RFC2253 | grep -q "CN={{ projects.supabase.domain }}"
  register: pg_cert_check
  failed_when: false
  changed_when: false
  when: pg_cert.stat.exists

- name: Generate self-signed cert if missing or domain mismatch
  ansible.builtin.shell: |
    openssl req -x509 -nodes -days 365 \
      -newkey rsa:2048 \
      -keyout {{ postgres_cert_path }}/server.key \
      -out {{ postgres_cert_path }}/server.crt \
      -subj "/CN={{ projects.supabase.domain }}" \
      -addext "subjectAltName=DNS:{{ projects.supabase.domain }},DNS:localhost,IP:127.0.0.1{% if ansible_default_ipv4 is defined and ansible_default_ipv4.address is defined %},IP:{{ ansible_default_ipv4.address }}{% endif %}"
  when: >
    (not pg_cert.stat.exists) or
    (pg_cert_check.rc | default(1)) != 0

- name: Set ownership and permissions on generated Postgres SSL files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "100"
    group: "101"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ postgres_cert_path }}/server.key", mode: "0600" }
    - { path: "{{ postgres_cert_path }}/server.crt", mode: "0644" }

- name: Create Supabase files
  template:
    src: "{{ item.src }}.j2"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: "docker-compose-supabase.yml", dest: "/home/{{ deploy_user }}/{{ supabase_path }}/docker-compose-supabase.yml", mode: '0664' }
    - { src: "docker-compose-logs.yml", dest: "/home/{{ deploy_user }}/{{ supabase_path }}/docker-compose-logs.yml", mode: '0664' }
    - { src: "vector-logs.yml", dest: "/home/{{ deploy_user }}/{{ supabase_path }}/volumes/logs/vector.yml", mode: '0664' }
    - { src: "kong-supabase.yml", dest: "/home/{{ deploy_user }}/{{ supabase_path }}/{{ kong_conf_path }}/kong.yml", mode: '0664' }
    - { src: "env-supabase", dest: "/home/{{ deploy_user }}/{{ supabase_path }}/.env", mode: '0664' }
    - { src: "start-supabase.sh", dest: "/home/{{ deploy_user }}/{{ supabase_path }}/start-supabase.sh", mode: '0755' }

- name: Create backup network if needed
  shell: |
    NETWORK_NAME="supabase-backup-net{{ '-' + deploy_env if deploy_env != 'changeit' else '' }}"
    docker network inspect "$NETWORK_NAME" >/dev/null 2>&1 || docker network create "$NETWORK_NAME"
  when: backup_enabled | default(false) | bool

- name: Prepare backup paths on host
  copy:
    dest: "/tmp/prepare-backup-paths.sh"
    mode: "0755"
    content: |
      #!/bin/sh
      set -eu
      BACKUP_DIR="/home/{{ deploy_user }}/backup"
      BIN_DIR="$BACKUP_DIR/pgbackrest-bin"
      IMAGE="{{ pgbackrest_image | default('woblerr/pgbackrest:2.58.0-alpine') }}"

      # Remove Docker-created dirs that shadow our bind-mount sources
      for p in /usr/bin/pgbackrest "$BIN_DIR/pgbackrest" "$BIN_DIR"/lib* "$BIN_DIR"/ld-musl*; do
        [ -e "$p" ] || continue
        [ -d "$p" ] && rm -rf "$p" || rm -f "$p"
      done

      # Extract pgbackrest binary + shared libraries from the Docker image
      if [ ! -f "$BIN_DIR/pgbackrest" ]; then
        echo "Pulling $IMAGE..."
        docker pull "$IMAGE"
        TMPCTR="pgbackrest-extract-$$"
        docker create --name "$TMPCTR" "$IMAGE"
        mkdir -p "$BIN_DIR"
        docker cp "$TMPCTR:/usr/bin/pgbackrest" "$BIN_DIR/pgbackrest"
        # Copy whole lib dirs — docker cp takes no globs. Several are needed
        # because the layout differs by distro: Alpine keeps dependencies in
        # /usr/lib but the musl loader is a real file in /lib, while Debian
        # multiarch puts nearly everything under /usr/lib/x86_64-linux-gnu and
        # the glibc loader in /lib64. Missing dirs are not an error — the image
        # only has the ones its distro uses.
        for d in /usr/lib /lib /lib64 /usr/lib/x86_64-linux-gnu; do
          docker cp "$TMPCTR:$d" "$BIN_DIR/src$(echo "$d" | tr / _)" 2>/dev/null || true
        done
        # Move only the libs pgbackrest needs into the flat BIN_DIR. -L resolves
        # symlinks into real files, since anything left pointing at an absolute
        # in-image path dangles once it is outside the image.
        for lib in libbz2.so libcrypto.so libcurl.so libgcrypt.so libgpg-error.so libhistory.so libintl.so libjson-c.so liblz4.so liblzma.so libpcre2.so libpq.so libprotobuf-c.so libssh2.so libssl.so libxml2.so libz.so libzstd.so libc.musl ld-musl ld-linux-x86-64; do
          for src in "$BIN_DIR"/src_*; do
            [ -d "$src" ] || continue
            cp -L "$src/${lib}"* "$BIN_DIR/" 2>/dev/null || true
          done
        done
        # On musl the loader *is* the C library — one file under two names. The
        # libc.musl-* symlink cannot survive the copy, so materialise it from
        # the loader we now hold as a real file.
        for ld in "$BIN_DIR"/ld-musl-*.so.1; do
          [ -f "$ld" ] || continue
          libc="$BIN_DIR/libc.musl-${ld##*/ld-musl-}"
          [ -f "$libc" ] || cp "$ld" "$libc"
        done
        rm -rf "$BIN_DIR"/src_*
        docker rm "$TMPCTR"
        chmod 755 "$BIN_DIR/pgbackrest"
        chown -R root:root "$BIN_DIR"
        echo "Extracted pgbackrest binary and $(ls "$BIN_DIR"/*.so* 2>/dev/null | wc -l) shared libraries"
      fi

      # Verify extraction succeeded
      if [ ! -f "$BIN_DIR/pgbackrest" ]; then
        echo "ERROR: pgbackrest binary not found in $BIN_DIR" >&2
        exit 1
      fi
      # Which libc did the image use? Everything downstream differs, so detect
      # it rather than assume: an Alpine image yields ld-musl-*.so.1, a glibc
      # one does not. This is what lets pgbackrest_image be switched between
      # variants without touching the role.
      ld_musl=""
      for f in "$BIN_DIR"/ld-musl-*.so.1; do
        [ -f "$f" ] && { ld_musl="$f"; break; }
      done

      missing=""
      for lib in libpq.so libxml2.so libssl.so libcrypto.so liblz4.so libz.so libzstd.so; do
        ls "$BIN_DIR/${lib}"* >/dev/null 2>&1 || missing="$missing $lib"
      done
      # The loader and the C library are only ours to ship in the musl case.
      # A glibc build uses the db container's own, which is already there.
      if [ -n "$ld_musl" ]; then
        for lib in ld-musl libc.musl; do
          ls "$BIN_DIR/${lib}"* >/dev/null 2>&1 || missing="$missing $lib"
        done
      fi
      if [ -n "$missing" ]; then
        echo "ERROR: missing shared libraries:$missing" >&2
        exit 1
      fi

      # Create the wrapper that the db container sees as /usr/bin/pgbackrest.
      #
      # supabase/postgres is itself musl-based, so /lib/ld-musl-x86_64.so.1 is
      # already there and the extracted binary execs natively — no loader to
      # invoke by hand.
      #
      # The libraries do have to come from us. An inventory of the container
      # shows it ships libssl, libcrypto, libz and libzstd but *not* libxml2,
      # libpq, libssh2, liblz4 or libbz2, and ldd on the binary confirms it:
      #   Error loading shared library libpq.so.5: No such file or directory
      # so it cannot satisfy pgbackrest on its own.
      #
      # LD_LIBRARY_PATH rather than --library-path, and that distinction is the
      # whole bug. --library-path is an argument to one loader invocation;
      # LD_LIBRARY_PATH is environment, and environment is inherited. pgbackrest
      # forks workers for backup by re-executing itself, and those children
      # inherit this while they could never inherit a loader flag — which is why
      # the main process worked and every forked worker died with
      # "Error relocating ...: symbol not found".
      printf '#!/bin/sh\nexport LD_LIBRARY_PATH=/usr/lib/pgbackrest-bin\nexec /usr/lib/pgbackrest-bin/pgbackrest "$@"\n' \
        > "$BACKUP_DIR/pgbackrest-wrapper"
      chmod 755 "$BACKUP_DIR/pgbackrest-wrapper"
      [ -n "$ld_musl" ] && chmod 755 "$ld_musl"
      echo "Wrapper execs pgbackrest directly; libraries resolve from the container."

      # NOTE: do not bind-mount a loader over /lib/ld-musl-*.so.1 or write
      # /etc/ld-musl-*.path in the db container. That was tried to make forked
      # pgbackrest workers resolve our libraries, and it broke the container
      # outright — start-supabase.sh failed after 11 minutes. supabase/postgres
      # is itself musl-based (busybox ls, /sbin/nologin, an Alpine-shaped
      # passwd), so those two files belong to the image: replacing the loader
      # and redirecting the default search path affects every binary inside,
      # not just pgbackrest.

      # Ensure pgbackrest.conf placeholder exists (backup role renders the real config)
      CONF="$BACKUP_DIR/pgbackrest.conf"
      [ -f "$CONF" ] || install -m 0640 /dev/null "$CONF"

      # Ownership for the directories pgbackrest writes to: lock, log, spool.
      #
      # These matter only for archive-push, which the postmaster spawns as the
      # postgres user — stanza-create and backup are run through docker exec as
      # root and can write regardless, which is why they can succeed while
      # every archive-push fails. The uid was hardcoded to 100:101, a guess
      # about the image's internals that goes wrong silently the moment the
      # image changes it. Ask the image instead.
      # Do not go looking for a user called "postgres": nothing here establishes
      # that name. supabase_admin, which appears throughout the config, is a
      # PostgreSQL role rather than a Unix account, and the compose file sets no
      # `user:`. The owner of PGDATA *is* the account the postmaster runs as,
      # whatever it is called, so read that instead of guessing a name.
      DB_IMAGE="{{ sb_db_version }}"
      DB_CTR="supabase-db{{ '-' + deploy_env if deploy_env != 'changeit' else '' }}"
      pg_ids=""
      # A running container is the most authoritative source; on a re-run it is
      # already there. Fall back to the image, where PGDATA itself may not exist
      # before initdb but its parent does.
      if docker ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -qx "$DB_CTR"; then
        pg_ids="$(docker exec "$DB_CTR" stat -c '%u %g' /var/lib/postgresql/data 2>/dev/null || true)"
      fi
      [ -n "$pg_ids" ] || pg_ids="$(docker run --rm --entrypoint stat "$DB_IMAGE" -c '%u %g' /var/lib/postgresql/data 2>/dev/null || true)"
      [ -n "$pg_ids" ] || pg_ids="$(docker run --rm --entrypoint stat "$DB_IMAGE" -c '%u %g' /var/lib/postgresql 2>/dev/null || true)"
      pg_uid="${pg_ids%% *}"; pg_gid="${pg_ids##* }"
      case "$pg_uid:$pg_gid" in
        [0-9]*:[0-9]*) ;;
        *)
          echo "WARNING: could not read PGDATA ownership from $DB_CTR or $DB_IMAGE; falling back to 100:101" >&2
          pg_uid=100; pg_gid=101 ;;
      esac
      echo "pgbackrest work dirs will be owned by ${pg_uid}:${pg_gid} (owner of PGDATA)"

      mkdir -p "$BACKUP_DIR/volumes/pgbackrest/lock"
      mkdir -p "$BACKUP_DIR/volumes/pgbackrest-log"
      mkdir -p "$BACKUP_DIR/volumes/pgbackrest-spool/archive"
      chown -R "$pg_uid:$pg_gid" "$BACKUP_DIR/volumes/pgbackrest"
      chown -R "$pg_uid:$pg_gid" "$BACKUP_DIR/volumes/pgbackrest-log"
      chown -R "$pg_uid:$pg_gid" "$BACKUP_DIR/volumes/pgbackrest-spool"
  when: backup_enabled | default(false) | bool

- name: Run backup path preparation
  command: bash /tmp/prepare-backup-paths.sh
  when: backup_enabled | default(false) | bool

# --- Render pgbackrest.conf BEFORE the db container is created, so boot-time
# archive_command reads the correct repo config (and the fresh container binds
# its inode). Re-rendered by the backup role later (with unsafe_writes). ---
- name: Render pgbackrest.conf
  template:
    src: "{{ playbook_dir }}/roles/backup/templates/pgbackrest.conf.j2"
    dest: "/home/{{ deploy_user }}/backup/pgbackrest.conf"
    owner: "100"
    group: "101"
    mode: "0644"
  when: backup_enabled | default(false) | bool

# --- Bring up MinIO before Supabase starts, so WAL archiving resolves on first boot ---
- name: Render backup compose for MinIO
  template:
    src: "{{ playbook_dir }}/roles/backup/templates/docker-compose-backup.yml.j2"
    dest: "/home/{{ deploy_user }}/backup/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  when: (backup_enabled | default(false) | bool) and (backup_repo_type | default('minio')) == 'minio'

- name: Start MinIO
  command: docker compose up -d minio
  args:
    chdir: "/home/{{ deploy_user }}/backup"
  changed_when: false
  when: (backup_enabled | default(false) | bool) and (backup_repo_type | default('minio')) == 'minio'

- name: Start Supabase
  command: "bash /home/{{ deploy_user }}/{{ supabase_path }}/start-supabase.sh"

# --- Realtime tenant rate limits ---------------------------------------------
# Realtime throttles postgres-change events per tenant to 100/s by default.
# Bulk mining writes persons faster than that, so realtime drops events
# ("MessagePerSecondRateLimitReached") and the credits/profile channel in the
# same cluster can be starved. The per-tenant limits live in _realtime.tenants,
# which is owned by the supabase_admin superuser — the non-superuser migration
# runner cannot update it — so apply idempotently here through the local db
# container. Realtime's tenant cache expires (~60s default), so the raised
# limits are picked up without a container restart.
- name: Raise realtime tenant rate limits
  ansible.builtin.shell: >-
    docker exec
    supabase-db{{ '-' + deploy_env | default('changeit') if deploy_env | default('changeit') != 'changeit' else '' }}
    psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c
    "UPDATE _realtime.tenants
       SET max_events_per_second = 1000, max_bytes_per_second = 1000000
       WHERE max_events_per_second <> 1000 OR max_bytes_per_second <> 1000000;"
  register: realtime_limits_result
  changed_when: "'UPDATE 1' in realtime_limits_result.stdout"
  # A brand-new volume has no tenant row until the first realtime boot; the next
  # deploy after first boot applies the limits.
  failed_when: false
